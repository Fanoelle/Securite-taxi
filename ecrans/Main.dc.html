<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B5E4A; } a:hover { color: #134536; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F5F3EE; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #0E3B2E; padding: 52px 22px 20px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.3-2.9 8.2-7 9.5-4.1-1.3-7-5.2-7-9.5V6l7-3z"/></svg>
      <div style="color: #8FB3A5; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase">Véhicule scanné</div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">

    <div style="background: #FFFFFF; padding: 22px; display: flex; flex-direction: column; gap: 18px; border-bottom: 1px solid #E2DED4">

      <div style="display: flex; gap: 16px; align-items: flex-start">
        <div style="width: 104px; height: 124px; border-radius: 4px; background: linear-gradient(160deg, #C4BDB0 0%, #9E968A 100%); flex-shrink: 0; position: relative; overflow: hidden; border: 1px solid #B5AEA1">
          <svg width="104" height="124" viewBox="0 0 104 124" style="position: absolute; top: 0; left: 0">
            <circle cx="52" cy="44" r="21" fill="#7D766B"/>
            <path d="M52 71c-19 0-34 12-34 27v26h68V98c0-15-15-27-34-27z" fill="#7D766B"/>
          </svg>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-width: 0">
          <div>
            <div style="font-size: 23px; font-weight: 800; color: #14261F; line-height: 1.15; letter-spacing: -0.3px">NGONO<br>Paul Bertrand</div>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 6px; background: #E8F2ED; border: 1px solid #A8CDBC; border-radius: 3px; padding: 6px 9px; align-self: flex-start">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1B5E4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            <span style="font-size: 12.5px; font-weight: 700; color: #1B5E4A; letter-spacing: 0.2px">VÉRIFIÉ</span>
          </div>
          <div style="font-size: 12.5px; color: #6B6459; line-height: 1.4">Licence 0447-DLA<br>Chauffeur depuis 2019</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px">
        <div style="font-size: 11px; font-weight: 700; color: #8A8377; letter-spacing: 1.2px; text-transform: uppercase">Plaque d'immatriculation</div>
        <div style="background: #14261F; border-radius: 5px; padding: 15px 18px; display: flex; align-items: center; justify-content: center">
          <span style="font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 39px; font-weight: 700; color: #FFFFFF; letter-spacing: 4px">LT 452 AB</span>
        </div>
        <div style="font-size: 12.5px; color: #6B6459">Toyota Corolla · Jaune · Douala</div>
      </div>

    </div>

    <div style="background: #FDF6E3; border-bottom: 1px solid #E8D9A8; padding: 15px 22px; display: flex; gap: 11px; align-items: flex-start">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A6B10" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>
      <div style="font-size: 13.5px; color: #6B4A0C; line-height: 1.45; font-weight: 500">Comparez la <strong style="font-weight: 700">photo</strong> et la <strong style="font-weight: 700">plaque</strong> avec ce que vous avez devant vous.</div>
    </div>

    <div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 11px">
      <button style="background: #1B5E4A; border: none; border-radius: 5px; padding: 18px; color: #FFFFFF; font-family: Archivo, sans-serif; font-size: 16.5px; font-weight: 700; letter-spacing: 0.2px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        C'est bien ce chauffeur
      </button>
      <button style="background: transparent; border: 1.5px solid #C9483A; border-radius: 5px; padding: 15px; color: #C9483A; font-family: Archivo, sans-serif; font-size: 14.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C9483A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v5"/><circle cx="12" cy="17.5" r="0.6" fill="#C9483A"/><path d="M10.3 3.9L2.5 18a1.9 1.9 0 001.7 2.9h15.6a1.9 1.9 0 001.7-2.9L13.7 3.9a1.9 1.9 0 00-3.4 0z"/></svg>
        Ça ne correspond pas
      </button>
    </div>

    <div style="margin-top: auto; padding: 0 22px 26px; display: flex; flex-direction: column; gap: 4px">
      <div style="border-top: 1px solid #E2DED4; padding-top: 15px; font-size: 12px; color: #6B6459; line-height: 1.45">Contrôlé par la Commune de Douala V<br>Dernière vérification : 14 mars 2026</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
