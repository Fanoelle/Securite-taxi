<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B5E4A; } a:hover { color: #134536; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F5F3EE; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #0E3B2E; padding: 52px 22px 20px; display: flex; flex-direction: column; gap: 5px">
    <div style="color: #8FB3A5; font-size: 11.5px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase">Suivi de trajet</div>
    <div style="color: #FFFFFF; font-size: 19px; font-weight: 700">Estelle est en route</div>
  </div>

  <div style="height: 250px; background: #E4E0D6; position: relative; overflow: hidden; border-bottom: 1px solid #D6D1C6">
    <svg width="390" height="250" viewBox="0 0 390 250" style="position: absolute; top: 0; left: 0">
      <rect width="390" height="250" fill="#E7E3DA"/>
      <path d="M-10 58 L400 38" stroke="#D5D0C4" stroke-width="12" fill="none"/>
      <path d="M-10 162 L400 146" stroke="#D5D0C4" stroke-width="9" fill="none"/>
      <path d="M78 -10 L92 260" stroke="#D5D0C4" stroke-width="10" fill="none"/>
      <path d="M268 -10 L282 260" stroke="#D5D0C4" stroke-width="8" fill="none"/>
      <rect x="106" y="70" width="52" height="38" fill="#DCD7CB"/>
      <rect x="180" y="64" width="70" height="46" fill="#DCD7CB"/>
      <rect x="106" y="176" width="60" height="42" fill="#DCD7CB"/>
      <rect x="300" y="170" width="58" height="48" fill="#DCD7CB"/>
      <path d="M60 224 C 110 218, 128 184, 152 152 S 214 104, 246 78" stroke="#1B5E4A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="224" r="7" fill="#FFFFFF" stroke="#8A8377" stroke-width="2.5"/>
      <circle cx="246" cy="78" r="16" fill="#1B5E4A" fill-opacity="0.16"/>
      <circle cx="246" cy="78" r="9" fill="#1B5E4A" stroke="#FFFFFF" stroke-width="3"/>
    </svg>
    <div style="position: absolute; left: 16px; bottom: 14px; background: rgba(255,255,255,0.95); border-radius: 4px; padding: 8px 12px">
      <span style="font-size: 12.5px; font-weight: 600; color: #3D3833">Boulevard de la Liberté, Akwa</span>
    </div>
  </div>

  <div style="background: #FFFFFF; padding: 18px 22px; border-bottom: 1px solid #E2DED4; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 11px; font-weight: 700; color: #8A8377; letter-spacing: 1.2px; text-transform: uppercase">Chauffeur</div>
    <div style="display: flex; gap: 13px; align-items: center">
      <div style="width: 58px; height: 68px; border-radius: 4px; background: #C4BDB0; flex-shrink: 0; overflow: hidden; position: relative; border: 1px solid #B5AEA1">
        <svg width="58" height="68" viewBox="0 0 58 68"><circle cx="29" cy="24" r="11" fill="#7D766B"/><path d="M29 39c-10 0-18 6-18 14v15h36V53c0-8-8-14-18-14z" fill="#7D766B"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 16px; font-weight: 700; color: #14261F">NGONO Paul Bertrand</div>
        <div style="background: #14261F; border-radius: 3px; padding: 6px 10px; align-self: flex-start">
          <span style="font-family: 'Archivo Narrow', Archivo, sans-serif; font-size: 19px; font-weight: 700; color: #FFFFFF; letter-spacing: 2.5px">LT 452 AB</span>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 5px; align-self: flex-start">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1B5E4A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span style="font-size: 11.5px; font-weight: 700; color: #1B5E4A; letter-spacing: 0.3px">VÉRIFIÉ · Licence 0447-DLA</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E2DED4; border-radius: 5px; padding: 12px 14px">
        <div style="font-size: 11px; color: #8A8377; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px">Départ</div>
        <div style="font-size: 14px; font-weight: 700; color: #14261F; font-variant-numeric: tabular-nums">19h42</div>
      </div>
      <div style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E2DED4; border-radius: 5px; padding: 12px 14px">
        <div style="font-size: 11px; color: #8A8377; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px">Durée</div>
        <div style="font-size: 14px; font-weight: 700; color: #14261F; font-variant-numeric: tabular-nums">18 min</div>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 26px; display: flex; flex-direction: column; gap: 10px">
    <button style="background: #FFFFFF; border: 1.5px solid #1B5E4A; border-radius: 5px; padding: 16px; color: #1B5E4A; font-family: Archivo, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B5E4A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 1.9.6 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.1a2 2 0 012.1-.5c.9.3 1.8.5 2.8.6a2 2 0 011.7 2z"/></svg>
      Appeler Estelle
    </button>
    <button style="background: transparent; border: 1px solid #E0B3AC; border-radius: 5px; padding: 14px; color: #C9483A; font-family: Archivo, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">
      Signaler un problème
    </button>
    <div style="font-size: 11.5px; color: #8A8377; text-align: center; line-height: 1.45; margin-top: 4px">Ce lien expire à la fin du trajet.</div>
  </div>

</div>
</x-dc>
</body>
</html>
