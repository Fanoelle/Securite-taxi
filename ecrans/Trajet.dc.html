<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B5E4A; } a:hover { color: #134536; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F5F3EE; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #0E3B2E; padding: 52px 22px 18px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 9px">
      <div style="width: 9px; height: 9px; border-radius: 5px; background: #4ADE80"></div>
      <div style="color: #FFFFFF; font-size: 16px; font-weight: 700">Trajet en cours</div>
    </div>
    <div style="color: #8FB3A5; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums">18 min</div>
  </div>

  <div style="height: 262px; background: #E4E0D6; position: relative; overflow: hidden; border-bottom: 1px solid #D6D1C6">
    <svg width="390" height="262" viewBox="0 0 390 262" style="position: absolute; top: 0; left: 0">
      <rect width="390" height="262" fill="#E7E3DA"/>
      <path d="M-10 60 L400 40" stroke="#D5D0C4" stroke-width="12" fill="none"/>
      <path d="M-10 168 L400 152" stroke="#D5D0C4" stroke-width="9" fill="none"/>
      <path d="M78 -10 L92 272" stroke="#D5D0C4" stroke-width="10" fill="none"/>
      <path d="M268 -10 L282 272" stroke="#D5D0C4" stroke-width="8" fill="none"/>
      <rect x="106" y="72" width="52" height="38" fill="#DCD7CB"/>
      <rect x="180" y="66" width="70" height="46" fill="#DCD7CB"/>
      <rect x="106" y="182" width="60" height="42" fill="#DCD7CB"/>
      <rect x="300" y="176" width="58" height="48" fill="#DCD7CB"/>
      <rect x="0" y="212" width="66" height="50" fill="#DCD7CB"/>
      <path d="M60 232 C 110 226, 128 190, 152 158 S 214 108, 246 82" stroke="#1B5E4A" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="1 0"/>
      <circle cx="60" cy="232" r="7" fill="#FFFFFF" stroke="#8A8377" stroke-width="2.5"/>
      <circle cx="246" cy="82" r="16" fill="#1B5E4A" fill-opacity="0.16"/>
      <circle cx="246" cy="82" r="9" fill="#1B5E4A" stroke="#FFFFFF" stroke-width="3"/>
    </svg>
    <div style="position: absolute; left: 16px; bottom: 14px; background: rgba(255,255,255,0.95); border-radius: 4px; padding: 8px 12px; display: flex; align-items: center; gap: 8px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1B5E4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span style="font-size: 12.5px; font-weight: 600; color: #3D3833">Akwa · position à l'instant</span>
    </div>
  </div>

  <div style="background: #FFFFFF; padding: 15px 22px; border-bottom: 1px solid #E2DED4; display: flex; align-items: center; gap: 13px">
    <div style="width: 46px; height: 46px; border-radius: 4px; background: #C4BDB0; flex-shrink: 0; overflow: hidden; position: relative">
      <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="18" r="8.5" fill="#7D766B"/><path d="M23 29c-8 0-14 5-14 11v6h28v-6c0-6-6-11-14-11z" fill="#7D766B"/></svg>
    </div>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 700; color: #14261F">NGONO Paul Bertrand</div>
      <div style="font-size: 13px; color: #6B6459; font-family: 'Archivo Narrow', Archivo, sans-serif; letter-spacing: 0.8px; font-weight: 600">LT 452 AB</div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #E8F2ED; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B5E4A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 1.9.6 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.1a2 2 0 012.1-.5c.9.3 1.8.5 2.8.6a2 2 0 011.7 2z"/></svg>
    </div>
  </div>

  <div style="padding: 15px 22px; display: flex; flex-direction: column; gap: 9px">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B5E4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <span style="font-size: 13.5px; color: #3D3833; font-weight: 500">Maman suit votre trajet</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8377" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span style="font-size: 13.5px; color: #6B6459">Position envoyée toutes les 90 s</span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 26px; display: flex; flex-direction: column; gap: 11px">
    <button style="background: #C9483A; border: none; border-radius: 5px; padding: 21px; color: #FFFFFF; font-family: Archivo, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.4px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v5"/><circle cx="12" cy="17.5" r="0.7" fill="#FFFFFF"/><path d="M10.3 3.9L2.5 18a1.9 1.9 0 001.7 2.9h15.6a1.9 1.9 0 001.7-2.9L13.7 3.9a1.9 1.9 0 00-3.4 0z"/></svg>
      ALERTE
    </button>
    <div style="font-size: 12.5px; color: #6B6459; text-align: center; line-height: 1.45">Envoie votre position exacte à vos proches</div>
    <button style="background: transparent; border: 1px solid #D6D1C6; border-radius: 5px; padding: 14px; color: #55504A; font-family: Archivo, sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 3px">
      Je suis arrivé · Terminer
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
